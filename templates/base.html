<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- SEO Meta Tags -->
    <!-- SEO Meta Tags -->
<meta name="description" content="Nathaniel Katugwa is a Computer Science student, Python developer, and entrepreneur. Explore his projects in web development, branding, and business innovation.">
<meta name="author" content="Nathaniel Katugwa">

  <!-- Open Graph Meta Tags -->
  <meta property="og:site_name" content="Nathaniel Katugwa Portfolio" />
  <meta property="og:site" content="https://yourdomain.com" />
  <meta property="og:title" content="Nathaniel Katugwa | Web Developer" />
  <meta property="og:description" content="Explore my projects in Python, web development, procurement systems, and branding. Building technology and business with impact." />
  <meta property="og:image" content="https://yourdomain.com/static/images/preview.jpg" />
  <meta property="og:url" content="https://yourdomain.com" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Nathaniel Katugwa | Python Developer & Entrepreneur">
  <meta name="twitter:description" content="Computer Science student building real-world projects in tech and business.">
  <meta name="twitter:image" content="https://yourdomain.com/static/images/preview.jpg">


  <title>{% block title %}Portfolio{% endblock %}</title>

    <!-- Styles -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fontawesome-all.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">



	<!-- Favicon  -->
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}">
</head>

<body data-spy="scroll" data-target=".fixed-top">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container">
            <!-- Text Logo - Use this if you don't have a graphic logo -->
            <a class="navbar-brand logo-text page-scroll" href="index.html">Nathaniel</a>

            <button class="navbar-toggler p-0 border-0" type="button" data-toggle="offcanvas">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="navbar-collapse offcanvas-collapse" id="navbarsExampleDefault">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a class="nav-link page-scroll" href="#header">Home <span class="sr-only">(current)</span></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link page-scroll" href="#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link page-scroll" href="#services">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link page-scroll" href="#contact">Contact</a>
                    </li>
                </ul>
                <span class="nav-item social-icons">
                    <span class="fa-stack">
                        <a href="#your-link">
                            <i class="fas fa-circle fa-stack-2x"></i>
                            <i class="fab fa-facebook-f fa-stack-1x"></i>
                        </a>
                    </span>
                    <span class="fa-stack">
                        <a href="#your-link">
                            <i class="fas fa-circle fa-stack-2x"></i>
                            <i class="fab fa-twitter fa-stack-1x"></i>
                        </a>
                    </span>
                </span>
            </div> <!-- end of navbar-collapse -->
        </div> <!-- end of container -->
    </nav> <!-- end of navbar -->
    <!-- end of navigation -->
<main class="container-fluid p-0">
  {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script><!-- jQuery for Bootstrap's JavaScript plugins -->
<script src="{{ url_for('static', filename='js/jquery.easing.min.js') }}"></script><!-- jQuery Easing for smooth scrolling between anchors -->
<script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script><!-- Bootstrap framework -->
<script src="{{ url_for('static', filename='js/scripts.js') }}"></script>

</body>
</html>
